# Windows packaging config. Run: npm run dist:win  (output goes to release/)
appId: app.nexus.desktop
productName: NEXUS
copyright: Made by and for our friend group
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: NEXUS-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: NEXUS
